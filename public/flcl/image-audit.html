function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showCards(){el.innerHTML=MANIFEST.map((s,i)=>'<section class="card" id="s'+i+'" data-format="'+safe(s.format)+'"><header><h2>'+s.number+'. '+safe(s.title)+'</h2><div class="meta">'+safe(s.section)+' · '+(s.assets.length?s.assets.length+'개 자료':'텍스트 인포그래픽')+'</div></header>'+(s.assets.map((a,j)=>'<div class="asset" id="a'+i+'-'+j+'"><img alt="" loading="lazy" /><div class="details"><div class="state">검사 전</div><small>'+safe(a.kind)+' · '+safe(a.alt)+'</small><a target="_blank" rel="noopener noreferrer" href="'+safe(a.source)+'">원본 출처 보기</a></div></div>').join('')||'<p class="placeholder">자체 제작한 텍스트/도식 슬라이드 — 외부 이미지 없음</p>')+'</section>').join('')}
function getImage(url){return new Promise(resolve=>{let done=false;const im=new Image;im.referrerPolicy='no-referrer';let timer=setTimeout(()=>fin(false),14000);function fin(ok){if(done)return;done=true;clearTimeout(timer);im.onload=null;im.onerror=null;resolve({ok,width:im.naturalWidth,height:im.naturalHeight})}im.onload=()=>fin(im.naturalWidth>79&&im.naturalHeight>59);im.onerror=()=>fin(false);im.src=url})}
async function runAudit(){document.getElementById('run').disabled=true;const jobs=[];MANIFEST.forEach((s,i)=>s.assets.forEach((a,j)=>jobs.push({i,j,a})));let n=0,fail=0,k=0;const results=new Map;document.getElementById('stats').textContent='검사 중 · 0/'+jobs.length;
async function worker(){while(k<jobs.length){const job=jobs[k++],cache=results.get(job.a.url);let result;if(cache)result=await cache;else{const task=getImage(job.a.url);results.set(job.a.url,task);result=await task;}
let asset=document.getElementById('a'+job.i+'-'+job.j),label=asset.querySelector('.state'),img=asset.querySelector('img');label.textContent=result.ok?'표시 가능 · '+result.width+'×'+result.height:'실패 · 원본 차단 또는 응답 오류';label.className='state '+(result.ok?'ok':'failed');if(result.ok)img.src=job.a.url;else{fail++;document.getElementById('s'+job.i).classList.add('fail')}n++;document.getElementById('stats').textContent='검사 중 · '+n+'/'+jobs.length+' / 실패 '+fail;}}
await Promise.all(Array.from({length:8},worker));document.getElementById('stats').textContent='검사 완료 · '+jobs.length+'건 / 실패 '+fail+'건';document.getElementById('run').disabled=false;
}
function filterCards(mode){document.querySelectorAll('.card').forEach(c=>{c.classList.toggle('hidden',mode==='failed'?!c.classList.contains('fail'):(mode==='media'?c.dataset.format==='insight':false))})}
showCards();
